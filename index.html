<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo cáo Kiểm soát TTHC - Trích xuất Dữ liệu DVC</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SheetJS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 10px; border: none; }
        .btn-custom { background-color: #0d6efd; color: white; }
        .btn-custom:hover { background-color: #0b5ed7; color: white; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-9">
            <div class="card shadow-sm p-4">
                <h3 class="card-title text-center text-primary mb-4 fw-bold">
                    HỆ THỐNG TRÍCH XUẤT VÀ TỔNG HỢP BÁO CÁO KSTTHC
                </h3>

                <!-- Bước 1: Chọn loại báo cáo xuất -->
                <div class="mb-3">
                    <label for="exportType" class="form-label fw-semibold">1. Chọn loại báo cáo muốn xuất:</label>
                    <select id="exportType" class="form-select">
                        <option value="tong_hop">File Tổng hợp (Tổng số, Đang giải quyết, Nộp trực tuyến,...)</option>
                        <option value="07a_btp">File 07a_BTP_KSTT_H27.144 (Mẫu M10 Chi tiết)</option>
                    </select>
                </div>

                <!-- Bước 2: Tải file dữ liệu -->
                <div class="mb-3">
                    <label for="fileInput" class="form-label fw-semibold">2. Chọn các file dữ liệu xuất từ DVC (.xlsx):</label>
                    <input class="form-control" type="file" id="fileInput" multiple accept=".xlsx, .xls">
                    <div class="form-text text-muted">Có thể chọn nhiều file cùng lúc. Nếu chỉ số/tiêu chí nào không có dữ liệu, hệ thống sẽ tự động gán bằng 0.</div>
                </div>

                <!-- Thao tác -->
                <div class="d-grid gap-2 mt-4">
                    <button class="btn btn-primary btn-lg" onclick="processAndExport()">
                        <i class="bi bi-file-earmark-arrow-down"></i> Sử lý & Xuất Báo Cáo Tùy Chọn
                    </button>
                </div>

                <!-- Bảng hiển thị trạng thái / xem trước -->
                <div id="statusMessage" class="mt-4"></div>
            </div>
        </div>
    </div>
</div>

<script>
async function processAndExport() {
    const fileInput = document.getElementById('fileInput');
    const exportType = document.getElementById('exportType').value;
    const statusDiv = document.getElementById('statusMessage');

    if (fileInput.files.length === 0) {
        statusDiv.innerHTML = `<div class="alert alert-warning">Vui lòng chọn ít nhất một file Excel xuất từ DVC.</div>`;
        return;
    }

    statusDiv.innerHTML = `<div class="alert alert-info">Đang xử lý dữ liệu... Vui lòng đợi trong giây lát.</div>`;

    let compiledData = [];

    for (let i = 0; i < fileInput.files.length; i++) {
        const file = fileInput.files[i];
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data, { type: 'array' });
        
        // Đọc sheet đầu tiên của file
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

        // Xử lý trích xuất dòng/cột tương ứng
        let parsedRow = parseDVCData(jsonData, file.name, exportType);
        compiledData.push(parsedRow);
    }

    // Tạo file kết quả
    generateExcelOutput(compiledData, exportType);
    statusDiv.innerHTML = `<div class="alert alert-success">Xuất dữ liệu thành công! File đã được tải xuống.</div>`;
}

function parseDVCData(rows, fileName, exportType) {
    // Khởi tạo đối tượng lưu trữ thông số, mặc định bằng 0 nếu thiếu
    let result = {
        "Tên File": fileName,
        "Tổng số": 0,
        "Đang giải quyết": 0,
        "Đã giải quyết": 0,
        "Nộp trực tuyến": 0,
        "Trả kết quả trực tuyến": 0
    };

    if (exportType === "07a_btp") {
        result["Biểu mẫu"] = "07a_BTP_KSTT_H27.144";
        result["Chỉ tiêu M10_1"] = 0;
        result["Chỉ tiêu M10_2"] = 0;
    }

    // Duyệt qua các hàng để bóc tách giá trị thực tế
    for (let r = 0; r < rows.length; r++) {
        let row = rows[r];
        if (!row || row.length === 0) continue;

        for (let c = 0; c < row.length; c++) {
            let cellText = String(row[c] || '').trim().toLowerCase();
            
            // Tìm kiếm chỉ số theo từ khóa tương ứng
            if (cellText.includes("tổng số") || cellText.includes("tong so")) {
                result["Tổng số"] = parseFloat(row[c + 1]) || result["Tổng số"];
            } else if (cellText.includes("đang giải quyết")) {
                result["Đang giải quyết"] = parseFloat(row[c + 1]) || result["Đang giải quyết"];
            } else if (cellText.includes("đã giải quyết")) {
                result["Đã giải quyết"] = parseFloat(row[c + 1]) || result["Đã giải quyết"];
            } else if (cellText.includes("trực tuyến") || cellText.includes("truc tuyen")) {
                result["Nộp trực tuyến"] = parseFloat(row[c + 1]) || result["Nộp trực tuyến"];
            }
        }
    }

    return result;
}

function generateExcelOutput(data, exportType) {
    const worksheet = XLSX.utils.json_to_sheet(data);
    const workbook = XLSX.utils.book_new();
    
    let sheetName = exportType === "tong_hop" ? "Tong_Hop" : "07a_BTP_KSTT";
    XLSX.utils.book_append_sheet(workbook, worksheet, sheetName);

    let outputFileName = `${sheetName}_KetQua_${new Date().toISOString().slice(0,10)}.xlsx`;
    XLSX.writeFile(workbook, outputFileName);
}
</script>

</body>
</html>
